<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anatomie Muskel Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz-container">

        <!-- Kopfbereich -->
        <div class="top-bar">

            <div id="fortschritt">
                Muskel 1 / 99
            </div>

            <div id="punkte">
                Punkte: 0
            </div>

        </div>


        <!-- Titel -->
        <h1>Anatomie Muskel Quiz</h1>


        <!-- Aktueller Muskel -->
        <div class="muskel-box">

            <p class="frage-text">
                Welcher Ursprung und Ansatz gehört zu:
            </p>

            <h2 id="muskel">
                Lade Muskel...
            </h2>

        </div>


        <!-- Antwortmöglichkeiten -->
        <div id="antworten">
        </div>


        <!-- Rückmeldung -->
        <div id="feedback">
        </div>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
